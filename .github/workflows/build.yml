name: Bangun APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Siapkan kode sumber
        id: sumber
        run: |
          ZIP="$(ls *.zip 2>/dev/null | head -n 1 || true)"
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d _proyek
            DIR="$(dirname "$(find _proyek -name settings.gradle | head -n 1)")"
          else
            DIR="$(dirname "$(find . -name settings.gradle -not -path './_proyek/*' | head -n 1)")"
          fi
          if [ ! -f "$DIR/settings.gradle" ]; then
            echo "::error::Kode sumber tidak ditemukan. Unggah dulu file pengingat-berulang.zip ke repositori."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Bangun APK
        working-directory: ${{ steps.sumber.outputs.dir }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Ambil APK
        run: cp "${{ steps.sumber.outputs.dir }}/app/build/outputs/apk/release/app-release.apk" PengingatBerulang.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PengingatBerulang
          path: PengingatBerulang.apk

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pengingat Berulang v1.0.${{ github.run_number }}
          files: PengingatBerulang.apk
